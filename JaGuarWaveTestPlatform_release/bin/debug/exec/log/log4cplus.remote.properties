[log4cplus]  
log4cplus.rootLogger=ALL,global
log4cplus.appender.global=log4cplus::ConsoleAppender 
log4cplus.appender.global.File=C:\\global.log
log4cplus.appender.global.MaxFileSize=10MB 
log4cplus.appender.global.MaxBackupIndex=30 
log4cplus.appender.global.layout=log4cplus::PatternLayout 
log4cplus.appender.global.filters.1=log4cplus::spi::LogLevelRangeFilter
log4cplus.appender.global.filters.1.LogLevelMin=DEBUG
log4cplus.appender.global.filters.1.LogLevelMax=FATAL
log4cplus.appender.global.filters.1.AcceptOnMatch=true
log4cplus.appender.global.layout.ConversionPattern=%D %-5p - %m%n
log4cplus.appender.global.Locale=chs
