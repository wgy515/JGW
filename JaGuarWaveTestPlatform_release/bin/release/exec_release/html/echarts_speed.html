<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<script src="echarts-all.js"></script>
		<title></title>
	</head>
	<body>
		<style>
			html,
			body {
				margin: 0px;
				height: 100%;
			}
			#main {
				width: 100%;
				height: 100%;
				MARGIN: 0px auto;
			}
		</style>
		<!-- button type="button" class="btn btn-sm btn-success" onclick="refresh(true)">刷 新</button-->
		<div id="main" style="width: 100%;height: 100%;">	
		</div>
		<script type="text/javascript">
			var dom = document.getElementById("main");
			var myChart = echarts.init(dom);
			var xAxisDataList = [];
			var rateList = [];
			var speedList = [];
			var MaxListCount = 1000;
			option = {
				title: {
					text: 'Throughput Rate Test Rate Chart',
				},
				grid: {
					top: '12%',
					left: '3%',
					right: '3%',
					bottom: '1%',
					containLabel: true
				},
			    tooltip : {
			        trigger: 'axis',
			        formatter: function (params,ticket,callback) {
			        	var res = '';
			        	for (var i = 0, l = params.length; i < l; i++) {
			        		if (0 == i) {
			        			res +=  params[i].seriesName + ' : ' + params[i].value + ' Mbits/sec<br/>';
			        		} else {
			        			res +=  params[i].seriesName + ' : ' + params[i].value + ' Km/h<br/>';
			        		}      
			            }
			        	return res;
			        	/*
			            console.log(params)
			            var res = 'Function formatter : <br/>' + params[0].name;
			            for (var i = 0, l = params.length; i < l; i++) {
			                res += '<br/>' + params[i].seriesName + ' : ' + params[i].value;
			            }
			            setTimeout(function (){
			                callback(ticket, res);
			            }, 1000)
			            return 'loading';
			            */
			        }
			    },
			    color:['#ff69b4','#6495ed'],
			    legend: {
			        data:['Rate','Speed']
			    },
			    dataZoom: {
			    	show: true,
			    	start : 0,
			        end : 100,
			        height: 30,
			        y : 10
			    },
			    toolbox: {
			        show : true,
			        feature : {
			            mark : {show: true},
			            dataView : {show: true, readOnly: false},
			            magicType : {show: true, type: ['line', 'bar', 'stack', 'tiled']},
			            restore : {show: true},
			            saveAsImage : {show: true}
			        }
			    },
			    calculable : true,
			    xAxis : [
			        {
			            type : 'category',
			            boundaryGap : false,
			            scale : true,
			            splitLine: {
				            show: false, // 显示分割线
				            lineStyle: {
				                color: '#ccc', // 分割线颜色
				                type: 'dotted', // 分割线类型，例如：实线、虚线等
				                width: 1 // 分割线宽度
				            }
				        },
			            data : function() {
							return xAxisDataList;
						}()
				    }
			    ],
			    yAxis : [
			        {
			            type : 'value',
			            name : 'Mbits/sec',
			            scale : false,
			            axisLine : {
			            	lineStyle : {
			            		color:'#ff69b4'
			            	}
			            },
			            splitLine : {
			            	show: true, // 显示分割线
			            	
			            },
			            axisLabel : {
			                formatter: '{value}',
			                show: true,
							interval: 'auto', // {number}
							rotate: 0,
							margin: 18,
							color: '#ff0000',
							formatter: '{value}', // Template formatter!
							textStyle: {
								color: '#ff0000',
							}
			            }
			        },
			        {
			            type : 'value',
			            name : 'Km/h',
			            scale : false,
			            axisLine : {
			            	lineStyle : {
			            		color:'#6495ed'
			            	}
			            },
			            splitLine : {
			            	show: false, // 显示分割线
			            },
			            axisLabel : {
			                formatter: '{value}',
			                textStyle: {
								color: 'blue',
							}
			            }
			        }
						    
			    ],
			    series : [
			        {
			            name:'Rate',
			            type:'line',
			            data:function() {
							return rateList;
						}(),
			            lineStyle : {
			            		color:'#ff0000'
			            },
			            itemStyle: {
			            	color: 'blue' // 标记点的颜色
			            }
			        },
			        {
			            name:'Speed',
			            type:'line',
			            yAxisIndex: 1,
			            data:function() {
							return speedList;
						}()
			        }
			    ]
			};
                
            // 使用刚指定的配置项和数据显示图表。
			if(option && typeof option === "object") {
				myChart.setOption(option, true);
			}
			
			window.onresize = function() {
				changeDivHeight();
			}
			
			function changeDivHeight() {
				myChart.resize();
			}
			
			function UpdateName(series0_name,series1_name,yAxis0_name,yAxis1_name) {
				option.series[0].name = series0_name;
				option.series[1].name = series1_name;
				option.yAxis[0].name = yAxis0_name;
				option.yAxis[1].name = yAxis1_name;
				myChart.setOption(option, true);
			}
			
			function UpdateThrouphputRateSpeed(index,rate,speed) {
				xAxisDataList.push(index);
				rateList.push(rate);
				speedList.push(speed);
				
				if (xAxisDataList.length > MaxListCount) {
					xAxisDataList.shift();
				}
				if (rateList.length > MaxListCount) {
					rateList.shift();
				}
				if (speedList.length > MaxListCount) {
					speedList.shift();
				}
				if (1 == xAxisDataList.length) myChart.hideLoading();
				myChart.setOption(option,true,true);
			}
			
			function ClearThrouphputRateSpeed() {
				xAxisDataList.splice(0,xAxisDataList.length);
				rateList.splice(0,rateList.length);
				speedList.splice(0,speedList.length);
				myChart.showLoading(); // 显示加载动画
			}
			
			function SettingMaxListCount(max_count) {
				MaxListCount = max_count;
			}
			
			/*
			setInterval(function() {
				n += 1;
				updateThrouphputRateSpeed(n,Math.random() * 1000,Math.random() * 1000)
			}, 1000);*/
			
			myChart.showLoading(); // 显示加载动画
			/*
			var n = 0;
			setInterval(function() {
				n += 1;
				UpdateThrouphputRateSpeed(n,Math.random() * 1000,Math.random() * 1000);
				//if (n == 1)  myChart.hideLoading();
				//myChart.setOption(option,true,true);
			}, 1000);
			*/
		</script>
	</body>
</html>
