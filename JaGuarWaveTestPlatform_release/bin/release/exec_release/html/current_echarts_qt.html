<!DOCTYPE html>
<html>

	<head>
		<meta charset="utf-8">
		<title>ECharts</title>
		<!-- 引入 echarts.js -->
		<script src="echarts.min.js"></script>
	</head>

	<body>
		<!-- 为ECharts准备一个具备大小（宽高）的Dom -->
		<style>
			html,
			body {
				margin: 0px;
				height: 100%;
			}
			
			#main {
				width: 100%;
				height: 100%;
				MARGIN: 0px auto;
			}
		</style>
		<div id="main" style="width: 100%;height: 100%;">
		</div>
		<script type="text/javascript">
			var dom = document.getElementById("main");
			var myChart = echarts.init(dom);
			var len = 0;
			var option = null;
			var data = [];
			// var list = [];
			var angle = [];
			var n = 0;

			option = {
				title: {
					text: 'Throughput Rate Test Rate Chart',
					subtext: 'dongles'
				},
				tooltip: {
					trigger: 'axis',
					 formatter: function (params) {
					 	//if (-1 == angle[params[0].dataIndex])
					 	//	return 'Time : ' + params[0].axisValue + ' S ' + '<br/>' + params[0].seriesName + ' : ' + params[0].value ;
					 	//else
		            	//	return 'Rangle : ' + angle[params[0].dataIndex] + '<br/>' + 'time : ' + params[0].axisValue + ' s' + '<br/>' + params[0].seriesName + ' : ' + params[0].value ;
						return 'Angle : ' + angle[params[0].dataIndex] + '<br/>' + 'Mbps : ' + params[0].value;
		        }
				},
				grid: {
					top: '12%',
					left: '3%',
					right: '3%',
					bottom: '1%',
					containLabel: true
				},
				legend: {
					orient: 'horizontal', // 布局方式，默认为水平布局，可选为：
					// 'horizontal' ¦ 'vertical'
					x: 'center', // 水平安放位置，默认为全图居中，可选为：
					// 'center' ¦ 'left' ¦ 'right'
					// ¦ {number}（x坐标，单位px）
					y: 'top', // 垂直安放位置，默认为全图顶端，可选为：
					// 'top' ¦ 'bottom' ¦ 'center'
					// ¦ {number}（y坐标，单位px）
					backgroundColor: 'rgba(0,0,0,0)',
					borderColor: '#ccc', // 图例边框颜色
					borderWidth: 0, // 图例边框线宽，单位px，默认为0（无边框）
					padding: 5, // 图例内边距，单位px，默认各方向内边距为5，
					// 接受数组分别设定上右下左边距，同css
					itemGap: 10, // 各个item之间的间隔，单位px，默认为10，
					// 横向布局时为水平间隔，纵向布局时为纵向间隔
					itemWidth: 20, // 图例图形宽度
					itemHeight: 14, // 图例图形高度
					textStyle: {
						color: '#333' // 图例文字颜色
					}
				},
				toolbox: {
					show: true,
					feature: {
						mark: {
							show: true
						},
						dataZoom: {
							show: true
						},
						dataView: {
							show: true
						},
						magicType: {
							show: true,
							type: ['line', 'bar']
						},
						restore: {
							show: true
						},
						saveAsImage: {
							show: false
						}
					}
				},
				
				dataZoom: {
					realtime: true,
					//orient: 'vertical',   // 'horizontal'
					//x: 0,
					y: 10,
					//width: 400,
					height: 20,
					//!width: 400,
					//backgroundColor: 'rgba(221,160,221,0.5)',
					//dataBackgroundColor: 'rgba(138,43,226,0.5)',
					//fillerColor: 'rgba(38,143,26,0.6)',
					//handleColor: 'rgba(128,43,16,0.8)',
					//xAxisIndex:[],
					//yAxisIndex:[],
			        start : 0,
			        end : 100
				},
				xAxis: [{
					name: ' Angle',
					type: 'category',
					boundaryGap: false,
					data: function() {
						return angle;
					}()
				}],
				yAxis: [{
					name: ' Mb',
					type: 'value',
					splitNumber: '10',
					axisLabel: {
						show: true,
						interval: 'auto', // {number}
						rotate: 0,
						margin: 18,
						formatter: '{value}', // Template formatter!
						textStyle: {
							color: '#1e90ff',
							fontFamily: 'verdana',
							fontSize: 10,
							fontStyle: 'bo',
							fontWeight: 'normal'
						}
					}
				}],
				series: [{
					name: ' Mb/Angle',
					type: 'line',
					data: function() {
						return data;
					}()
				}],
				calculable: false
			};

			// 使用刚指定的配置项和数据显示图表。
			if(option && typeof option === "object") {
				myChart.setOption(option, true);
			}

			window.onresize = function() {
				changeDivHeight();
			}

			function updateName() {
				option.series[0].name = " Kb/Angle";
				option.yAxis[0].name = " Kb";
				myChart.setOption(option, true);
			}

			function changeDivHeight() {
				myChart.resize();
			}
			
			function clearData(){
				//list.splice(0,list.length);
				data.splice(0,data.length);
				angle.splice(0,angle.length);
			}
			
			function addData(index,dataVal) {
				angle.push(index);
				data.push(dataVal);
				//list.push(-1);
				myChart.setOption({
						xAxis: [{
						data: angle
					}],
					series: [{
						data: data
					}]
				})		
			}
			
			function addDataAngle(index,angleVal,dataVal) {
				//list.push(index);
				data.push(dataVal);
				angle.push(angleVal);
				myChart.setOption({
						xAxis: [{
						data: angle
					}],
					series: [{
						data: data
					}]
				})		
			}
			
			function addAngleMbps(angleVal,throughput) {
				data.push(throughput);
				angle.push(angleVal);
				myChart.setOption({
						xAxis: [{
						data: angle
					}],
					series: [{
						data: data
					}]
				})		
			}
			
			/*setInterval(function() {
				addAngleMbps(Math.random() * 1000,Math.random() * 1000)
			}, 1000);*/
			
			/*
			setInterval(function() {
				data.push(Math.round(Math.random() * 1000));
				n += 1;
				list.push(n);
				myChart.setOption({
						xAxis: [{
						data: list
					}],
					series: [{
						data: data
					}]
				});
			}, 1000);*/
			
			
		</script>

	</body>

</html>
